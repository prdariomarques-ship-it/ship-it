[mypy]
# Review fix (round 4, CI finding): whatsapp_agents_fix/ is this PR's own
# review/test harness, not production code -- it deliberately reloads real
# production modules under fake package names (app_stub/, see its
# conftest.py docstring) and ships minimal placeholder stand-ins (e.g.
# app_stub/database/__init__.py) that collide, by design, with real
# top-level module names like `database`. mypy's default file discovery
# walks the whole tree and treats that collision as a hard error
# ("Duplicate module named 'database'") before it ever reaches a single
# real backend module -- this was masked until now only because `ruff
# check .` (the CI step before type-checking) was failing first on an
# unrelated, already-fixed lint error. Excluding this harness directory
# lets mypy actually check the real backend code instead of refusing to
# start.
exclude = ^whatsapp_agents_fix/

# PROPOSTA — não aplicado, não mesclado no docker-compose.yml principal.
#
# Serviço separado para os monitores financeiros. Usa o mesmo Dockerfile
# do backend como contexto de build (não precisa de uma imagem adicional
# pra manter), mas gera sua PRÓPRIA imagem (`image:` abaixo) e roda um
# comando próprio (`python -m investments`, nunca uvicorn/main.py) — não é
# um segundo backend genérico, é só o worker financeiro isolado. Construir
# ou subir este serviço NUNCA reconstrói nem reinicia o serviço `backend`
# existente — são serviços e imagens Compose completamente separados.
#
# Isolamento real, não só "processo separado":
#   - Tabela própria (financial_jobs), nunca toca `jobs`.
#   - Sem rota HTTP, sem depender do WhatsApp provider/worker.
#   - Pool de conexão com o Postgres bem menor e próprio (DB_POOL_SIZE/
#     DB_MAX_OVERFLOW abaixo) — limitar CPU/RAM do contêiner não limita a
#     carga que ele gera no Postgres; isso sim limita.
#   - Limites de CPU/memória explícitos, pra não disputar recurso com o
#     atendimento ao vivo mesmo sob carga.
#
# Isolamento de permissão: DATABASE_URL abaixo usa FINANCIAL_DB_USER/
# FINANCIAL_DB_PASSWORD, uma role Postgres dedicada — NÃO a credencial do
# backend principal. O desenho dessa role (somente SELECT/INSERT/UPDATE
# em financial_jobs, sem acesso a `jobs`) está em
# docker/financial_role_setup.sql — preparado, mas NÃO aplicado contra
# nenhum banco por esta sessão; ver docker/FINANCIAL_DEPLOYMENT_RUNBOOK.md
# para o roteiro de quem for aplicar isso de fato. Enquanto
# FINANCIAL_DB_USER/PASSWORD não estiverem definidos no .env, estas
# variáveis ficam vazias e o serviço falha ao conectar de propósito — ele
# nunca cai de volta para a credencial do backend principal silenciosamente.
#
# Uso (só depois de autorizado — ver plano de implantação). Sempre
# nomeando o serviço explicitamente, nunca um `up -d` sem alvo:
#   docker compose -f docker-compose.yml -f docker-compose.financial.yml build financial-worker
#   docker compose -f docker-compose.yml -f docker-compose.financial.yml up -d financial-worker

services:
  financial-worker:
    build: ../backend
    image: darioos-financial-worker:latest
    command: ["python", "-m", "investments"]
    restart: unless-stopped
    environment:
      LOG_JSON: "true"
      # Dedicated, restricted role — never the backend's own credential.
      # No fallback to POSTGRES_USER/PASSWORD on purpose: an unset
      # FINANCIAL_DB_USER/PASSWORD must fail to connect, not silently run
      # under the shared backend credential (see financial_role_setup.sql
      # and FINANCIAL_DEPLOYMENT_RUNBOOK.md).
      DATABASE_URL: postgresql+asyncpg://${FINANCIAL_DB_USER:?set FINANCIAL_DB_USER in .env — see docker/financial_role_setup.sql}:${FINANCIAL_DB_PASSWORD:?set FINANCIAL_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-darioos}
      # Deliberately small and separate from the backend's own pool
      # (db_pool_size default 10 / db_max_overflow default 20) — this
      # process does at most ~1 query at a time per tick, it never needs
      # the backend's concurrency headroom, and capping it bounds how much
      # of Postgres's max_connections this service can ever claim.
      DB_POOL_SIZE: ${FINANCIAL_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${FINANCIAL_DB_MAX_OVERFLOW:-3}
      MARKET_MONITORS_ENABLED: ${MARKET_MONITORS_ENABLED:-false}
      MARKET_CHECK_INTERVAL_SECONDS: ${MARKET_CHECK_INTERVAL_SECONDS:-1200}
      SPCX34_TICKER: ${SPCX34_TICKER:-SPCX34.SA}
      SPCX34_BOLLINGER_WINDOW: ${SPCX34_BOLLINGER_WINDOW:-20}
      SPCX34_BOLLINGER_STD_MULT: ${SPCX34_BOLLINGER_STD_MULT:-2.0}
      TELEGRAM_BOT_TOKEN_SPCX: ${TELEGRAM_BOT_TOKEN_SPCX:-}
      TELEGRAM_CHAT_ID_SPCX: ${TELEGRAM_CHAT_ID_SPCX:-}
      TELEGRAM_BOT_TOKEN_B3: ${TELEGRAM_BOT_TOKEN_B3:-}
      TELEGRAM_CHAT_ID_B3: ${TELEGRAM_CHAT_ID_B3:-}
      TELEGRAM_BOT_TOKEN_MERCADO: ${TELEGRAM_BOT_TOKEN_MERCADO:-}
      TELEGRAM_CHAT_ID_MERCADO: ${TELEGRAM_CHAT_ID_MERCADO:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [darioos]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    # The base image's own HEALTHCHECK (Dockerfile) polls GET /health on
    # port 8000 — this process runs no HTTP server at all (see
    # investments/__main__.py), so that check would fail forever. Overridden
    # here with a check appropriate for a polling worker, reading the JSON
    # heartbeat worker.py::_write_heartbeat writes after every tick:
    #   - the file must exist and be recent (<120s: ~2 idle-poll intervals,
    #     generous margin for a slow tick) — this is the liveness half:
    #     "the loop is still ticking".
    #   - its own `healthy` field must be true — this is the readiness
    #     half: db_ok on the last tick AND consecutive_tick_failures below
    #     the threshold. A process that keeps looping but can't reach the
    #     database, or whose last 5+ ticks all raised, must NOT report
    #     healthy just because it's still alive — that was exactly the gap
    #     in the plain file-age check this replaces.
    # Still one combined signal in one Docker HEALTHCHECK, not a true
    # separate liveness/readiness pair the way Kubernetes exposes two probe
    # types: a real split would need either two separate files (one for
    # "process alive", one for "last tick healthy") each polled by its own
    # check, or an embedded HTTP server exposing /healthz and /readyz —
    # deliberately not built, since it would add the HTTP surface this
    # package has otherwise avoided end to end (see module docstrings).
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import json,os,sys,time; p='/tmp/financial_worker_heartbeat'; d=json.load(open(p)); sys.exit(0 if time.time()-os.path.getmtime(p)<120 and d.get('healthy') else 1)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

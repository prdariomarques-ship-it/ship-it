name: Telegram Command Poller

on:
  workflow_dispatch:
  schedule:
    - cron: "3/5 * * * *"

# One consumer per bot token: Telegram answers a concurrent getUpdates with 409 and a run overlapping the
# previous one could answer the same command twice. Never cancel a run that is mid-reply.
concurrency:
  group: telegram-commands
  cancel-in-progress: false

jobs:
  command-poller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reply to Telegram commands
        run: python work/market_command_bot.py

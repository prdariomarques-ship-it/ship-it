# Dependabot Configuration — OSAI
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Backend — Python (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    reviewers:
      - "prdariomarques-ship-it"
    labels:
      - "backend"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Security updates are prioritized
    groups:
      python-production:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend — npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    reviewers:
      - "prdariomarques-ship-it"
    labels:
      - "frontend"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-production:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    reviewers:
      - "prdariomarques-ship-it"
    labels:
      - "devops"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"

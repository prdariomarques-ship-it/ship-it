[project]
name = "market-bots"
version = "1.0.0"
description = "Two Telegram market bots (Brazil / global) - stdlib only, portable between VPS and PC"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "UP017"]

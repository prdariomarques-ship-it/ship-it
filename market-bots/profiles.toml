# market-bots: the two bots. Edit this file (no code change) to add/remove instruments, schedules and alert rules.
# Sources (no API key): Yahoo Finance chart endpoint, BCB SGS / Focus, AwesomeAPI (FX), CVM open data (filings).
# Symbols come from the source: Yahoo tickers (^BVSP, PETR4.SA, GC=F ...), FX pairs (USD-BRL), SGS codes (1178 ...).
timezone = "America/Sao_Paulo"

# ======================================================================================================================
# BOT 1 - MERCADO NACIONAL
# Telegram credentials: MB_NATIONAL_BOT_TOKEN / MB_NATIONAL_CHAT_ID
# ======================================================================================================================
[profiles.national]
title = "Mercado Brasil"
schedule = ["10:20", "18:20"]            # local time, business days
weekdays_only = true
catchup_minutes = 30                     # a missed slot is sent only if the bot is back within 30 min (no stale burst)
alert_interval_minutes = 15
alert_window = ["10:00", "18:00"]

[profiles.national.sections.indices]
title = "Bolsa Brasil"
instruments = [
  { kind = "yahoo", symbol = "^BVSP",     name = "Ibovespa",            unit = "pts", decimals = 0 },
  { kind = "yahoo", symbol = "^IBX50",    name = "IBrX 50",             unit = "pts", decimals = 0 },
  { kind = "yahoo", symbol = "SMAL11.SA", name = "Small caps (SMAL11)", unit = "R$" },
